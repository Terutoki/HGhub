<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>HGhubX · 短剧</title>
    <script>
      try {
        // 旧主题仅用于首次升级的首帧；React 启动后会迁移并清理旧键。
        const theme = localStorage.getItem("hghubx_theme") ?? localStorage.getItem("hghub_theme");
        if (theme === "light") document.documentElement.classList.add("theme-light");
      } catch (e) {}
    </script>
    <style>html,body{background:#1a1a1a}html.theme-light,html.theme-light body{background:#ebe8e2}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
